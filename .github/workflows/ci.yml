name: DPM Enterprise CI
on:
  push:
    branches: [main, enterprise-complete-build]
  pull_request:
    branches: [main]
jobs:
  migration-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check SQL migrations and basic inserts
        run: python3 tests/test_migrations.py

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Build public web frontend
        run: npm run build
