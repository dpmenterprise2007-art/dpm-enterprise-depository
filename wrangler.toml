name = "dpm-enterprise-os"
main = "src/worker.ts"
compatibility_date = "2026-11-22"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "dpm-enterprise-os"
database_id = "9aa7b6fa-8ba7-42d3-b119-320d31f3230a"

[[r2_buckets]]
binding = "DOCS"
bucket_name = "dpm-enterprise-documents"

[vars]
APP_NAME = "DPM Enterprise OS"
APP_ENV = "production"

[triggers]
crons = ["*/5 * * * *"]
